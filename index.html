<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<title>Blinder Passagier</title>
<style>
:root{--font:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif}
body[data-theme="hell"]{--page:#E6E1D4;--panel:#F4F1EA;--ink:#222;--muted:#6f6b60;--line:#cfc8b6;--sea:#F4F1EA;--land:#D9D0BB;--rail:#4d4d48;--ferry:#378ADD;--dot:#fff;--dotline:#222;--label:#222;--halo:#F4F1EA;--det:#E5383B;--detline:#222;--me:#1D9E75;--meline:#fff;--goal:#E0A100;--hint:#1D9E75;--tR:#6f6b60;--tI:#378ADD;--tN:#7C5CBF;--tS:#222;--tD:#1D9E75;--btn:#fff;--btnink:#222;--on:#1D9E75;--onink:#fff}
body[data-theme="gelb"]{--page:#E9C530;--panel:#F5D33F;--ink:#111;--muted:#4a3f08;--line:#111;--sea:#F5D33F;--land:#EBC22A;--rail:#111;--ferry:#111;--dot:#FFFBE6;--dotline:#111;--label:#111;--halo:#F5D33F;--det:#C1121F;--detline:#111;--me:#111;--meline:#F5D33F;--goal:#111;--hint:#111;--tR:#111;--tI:#7a5a00;--tN:#5a2d00;--tS:#111;--tD:#111;--btn:#FFFBE6;--btnink:#111;--on:#111;--onink:#F5D33F}
body[data-theme="nacht"]{--page:#0b0905;--panel:#14110A;--ink:#F5D33F;--muted:#a38e3a;--line:#3a3312;--sea:#14110A;--land:#25200f;--rail:#F5D33F;--ferry:#F5D33F;--dot:#14110A;--dotline:#F5D33F;--label:#F5D33F;--halo:#14110A;--det:#FF3B30;--detline:#fff;--me:#fff;--meline:#F5D33F;--goal:#fff;--hint:#fff;--tR:#F5D33F;--tI:#9FB8FF;--tN:#C9A5FF;--tS:#fff;--tD:#7BE3B0;--btn:#1c180c;--btnink:#F5D33F;--on:#F5D33F;--onink:#14110A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:520px;background:var(--panel);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--on);outline-offset:2px}
#hud{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px 6px}
#rnd{font-size:20px;font-weight:700;letter-spacing:-.01em}
#rnd small{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
#pips{display:flex;gap:5px;margin-top:3px}
#pips i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);display:block}
#pips i.pass{background:var(--ink)}
#pips i.next{outline:2px solid var(--det);outline-offset:1px}
#goal{text-align:right;font-size:13px;color:var(--muted);line-height:1.25}
#goal b{display:block;font-size:17px;color:var(--ink)}
#mapwrap{position:relative;background:var(--sea);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#sv{display:block;width:100%;height:auto;max-height:56vh;touch-action:none;user-select:none;-webkit-user-select:none}
#zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;border-radius:8px;border:1.5px solid var(--ink);background:var(--btn);color:var(--btnink);font-size:19px;line-height:1;padding:0}
#banner{position:absolute;left:0;right:0;top:12px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#banner span{display:inline-block;background:var(--ink);color:var(--panel);padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px}
#banner.show{opacity:1}
#tickets{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 10px 4px}
.tk{position:relative;border:1.5px solid var(--ink);background:var(--btn);color:var(--btnink);border-radius:8px;padding:6px 3px 5px;text-align:center;min-height:62px;line-height:1.15}
.tk b{display:block;font-size:12px}
.tk .n{display:block;font-size:20px;font-weight:700;margin:1px 0}
.tk small{display:block;font-size:11px;color:var(--muted)}
.tk::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;border-radius:6px 6px 0 0;background:var(--c)}
.tk[disabled]{opacity:.38;cursor:default}
.tk.on{background:var(--on);color:var(--onink);border-color:var(--on)}
.tk.on small{color:var(--onink)}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px 2px;min-height:38px}
#chips button{border:1.5px solid var(--ink);background:var(--btn);color:var(--btnink);border-radius:999px;padding:6px 11px;font-size:14px;line-height:1.1}
#chips button:active{background:var(--on);color:var(--onink)}
#msg{padding:4px 14px 6px;font-size:14px;min-height:40px;line-height:1.35}
#track{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;padding:2px 10px 6px}
#track div{height:30px;border-radius:5px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);position:relative}
#track div.rev{border-color:var(--det)}
#track div.cur{border-color:var(--ink)}
#track div span{display:inline-block;padding:1px 3px;border-radius:3px;color:var(--panel);margin:0 1px;font-size:11px;background:var(--c)}
#foot{display:flex;flex-wrap:wrap;gap:8px;padding:6px 10px 14px;justify-content:space-between}
#foot .grp{display:flex;gap:6px}
#foot button{border:1.5px solid var(--ink);background:var(--btn);color:var(--btnink);border-radius:8px;padding:7px 10px;font-size:13px}
#foot button.on{background:var(--on);color:var(--onink);border-color:var(--on)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:env(safe-area-inset-top) 12px 12px}
#ov.hide{display:none}
#card{margin-top:14px;width:100%;max-width:480px;background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:18px 18px 16px}
#card h1{font-size:30px;margin:0 0 2px;letter-spacing:-.02em}
#card h2{font-size:21px;margin:0 0 6px}
#card p{margin:0 0 10px;line-height:1.42;font-size:15px}
#card ul{margin:0 0 12px;padding-left:18px;font-size:14px;line-height:1.42}
#card li{margin-bottom:5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row button{flex:1 1 0;min-width:96px;border:1.5px solid var(--ink);background:var(--btn);color:var(--btnink);border-radius:9px;padding:10px 8px;font-size:15px}
.row button.on{background:var(--on);color:var(--onink);border-color:var(--on)}
.row button.go{background:var(--ink);color:var(--panel);font-weight:700}
.lab{font-size:13px;color:var(--muted);margin:10px 0 2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:4px 0 12px}
.legend span{display:flex;align-items:center;gap:5px}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.7s ease-out infinite}
.det{transition:transform .4s ease-in-out}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.5}.det{transition:none}#banner{transition:none}}
</style>
</head>

</div>

function setView(x,y,w){w=Math.max(80,Math.min(VW,w));const h=w*VH/VW;x=Math.max(-12,Math.min(VW-w+12,x));y=Math.max(-12,Math.min(VH-h+12,y));V={x,y,w,h};sv.setAttribute('viewBox',x+' '+y+' '+w+' '+h);gUL.style.display=(VW/w>=2.2)?'':'none'}
function zoomAt(cx,cy,f){const nw=Math.max(80,Math.min(VW,V.w*f));const s=nw/V.w;setView(cx-(cx-V.x)*s,cy-(cy-V.y)*s,nw)}
function centerOn(id,w){const p=SP[id];w=w||V.w;const h=w*VH/VW;setView(p.x-w/2,p.y-h/2,w)}
$('zin').onclick=()=>zoomAt(V.x+V.w/2,V.y+V.h/2,.65);
$('zout').onclick=()=>zoomAt(V.x+V.w/2,V.y+V.h/2,1.5);
$('zme').onclick=()=>{if(game){centerOn(game.pos,V.w>200?150:V.w)}};
// Pan / Pinch
const ptr=new Map(); let drag=0, pinch0=0;
sv.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});drag=0;if(ptr.size===2){const a=[...ptr.values()];pinch0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
sv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);const r=sv.getBoundingClientRect();
  if(ptr.size===1){const dx=e.clientX-o.x,dy=e.clientY-o.y;drag+=Math.abs(dx)+Math.abs(dy);if(drag>8){if(!sv.hasPointerCapture(e.pointerId)){try{sv.setPointerCapture(e.pointerId)}catch(_){}}setView(V.x-dx*V.w/r.width,V.y-dy*V.h/r.height,V.w)}ptr.set(e.pointerId,{x:e.clientX,y:e.clientY})}
  else if(ptr.size===2){ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=[...ptr.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch0>0&&d>0){const mx=((a[0].x+a[1].x)/2-r.left)/r.width*V.w+V.x,my=((a[0].y+a[1].y)/2-r.top)/r.height*V.h+V.y;zoomAt(mx,my,pinch0/d);pinch0=d;drag=99}}});
const up=e=>{ptr.delete(e.pointerId);if(drag>8){suppress=true;setTimeout(()=>suppress=false,80)}};
sv.addEventListener('pointerup',up);sv.addEventListener('pointercancel',up);
sv.addEventListener('wheel',e=>{e.preventDefault();const r=sv.getBoundingClientRect();const mx=(e.clientX-r.left)/r.width*V.w+V.x,my=(e.clientY-r.top)/r.height*V.h+V.y;zoomAt(mx,my,e.deltaY>0?1.15:.87)},{passive:false});

// ---------- Rendering ----------
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function banner(t,ms){const b=$('banner');b.firstChild.textContent=t;b.classList.add('show');if(ms)setTimeout(()=>b.classList.remove('show'),ms)}
function msg(t){$('msg').textContent=t}
function renderHud(){
  $('rnd').innerHTML='Runde '+Math.min(game.round,game.maxr)+'<small>von '+game.maxr+'</small>';
  $('goal').innerHTML='Ziel<b>'+nm(game.goal)+'</b>';
  const nextRev=NZ.REVEAL.find(r=>r>=game.round);
  $('pips').innerHTML=NZ.REVEAL.map(r=>'<i class="'+(r<game.round?'pass':'')+(r===nextRev?' next':'')+'" title="Aufdeckung in Runde '+r+'"></i>').join('');
}
function renderTickets(){
  const T=$('tickets');T.innerHTML='';
  ['R','I','N','S','D'].forEach(t=>{
    const b=document.createElement('button');b.className='tk'+((sel===t||(t==='D'&&armed))?' on':'');b.style.setProperty('--c','var('+TVAR[t]+')');
    const cnt=game.tickets[t];
    let dis=busy||game.over||cnt<=0;
    if(!dis&&t!=='D'&&NZ.legalMoves(G,game,t).length===0)dis=true;
    if(t==='D'&&(stage===1||!NZ.anyMove(G,game)))dis=true;
    b.disabled=dis;
    b.innerHTML='<b>'+TNAME[t]+'</b><span class="n">'+cnt+'</span><small>'+TSUB[t]+'</small>';
    b.onclick=()=>pick(t);
    T.appendChild(b);
  });
}
function renderChips(){
  const C=$('chips');C.innerHTML='';
  if(!sel||busy||game.over)return;
  const ds=NZ.legalMoves(G,game,sel).sort((a,b)=>nm(a).localeCompare(nm(b),'de'));
  ds.forEach(d=>{const b=document.createElement('button');const c=G.cat[d];b.textContent=(c===3?'● ':c===2?'○ ':'· ')+nm(d)+(G.ferry[game.pos].includes(d)?' (Fähre)':'');b.onclick=()=>{if(!suppress)move(d)};C.appendChild(b)});
}
function renderTrack(){
  const T=$('track');T.innerHTML='';
  for(let r=1;r<=game.maxr;r++){
    const d=document.createElement('div');const tr=game.track.find(x=>x.round===r);
    if(NZ.REVEAL.includes(r))d.className='rev';
    if(r===game.round&&!game.over)d.className+=' cur';
    if(tr)d.innerHTML=tr.types.map(t=>'<span style="--c:var('+TVAR[t]+')">'+t+'</span>').join('');else d.textContent=r;
    T.appendChild(d);
  }
}
function renderMarks(){
  gMarks.innerHTML='';gTrail.innerHTML='';gBel.innerHTML='';
  if(showBel)game.P.forEach(id=>{const p=SP[id];el('circle',{cx:p.x,cy:p.y,r:7,style:'fill:var(--det);opacity:.28'},gBel)});
  game.trail.slice(0,-1).forEach(id=>{const p=SP[id];el('circle',{cx:p.x,cy:p.y,r:2,style:'fill:var(--me);opacity:.55'},gTrail)});
  const g=SP[game.goal];
  el('polygon',{points:(g.x)+','+(g.y-9)+' '+(g.x+7)+','+g.y+' '+g.x+','+(g.y+9)+' '+(g.x-7)+','+g.y,style:'fill:var(--goal);stroke:var(--panel)','stroke-width':1.2},gMarks);
  if(!SP[game.goal].lab){const t=el('text',{x:g.x+9,y:g.y-6,style:'font-family:var(--font);font-size:11px;font-weight:700;fill:var(--label);paint-order:stroke;stroke:var(--halo);stroke-width:3px'},gMarks);t.textContent=nm(game.goal)}
  if(game.lastKnown){const p=SP[game.lastKnown.id];el('circle',{cx:p.x,cy:p.y,r:10,style:'fill:none;stroke:var(--det)','stroke-width':1.6,'stroke-dasharray':'3 2'},gMarks);const t=el('text',{x:p.x+11,y:p.y+14,style:'font-family:var(--font);font-size:10px;fill:var(--det);font-weight:700;paint-order:stroke;stroke:var(--halo);stroke-width:2.5px'},gMarks);t.textContent='R'+game.lastKnown.round}
  if(detEls.length!==detShow.length){gDet.innerHTML='';detEls=detShow.map(id=>{const p=SP[id];const gg=el('g',{class:'det',style:'transform:translate('+p.x+'px,'+p.y+'px)'},gDet);
    el('circle',{r:6,class:'pulse',style:'fill:none;stroke:var(--det)','stroke-width':2},gg);
    el('rect',{x:-6.5,y:-6.5,width:13,height:13,rx:1.5,style:'fill:var(--det);stroke:var(--detline)','stroke-width':1.6},gg);
    const t=el('text',{x:0,y:3.6,'text-anchor':'middle',style:'font-family:var(--font);font-size:10px;font-weight:700;fill:#fff;pointer-events:none'},gg);t.textContent='D';return gg})}
  detShow.forEach((id,i)=>{const p=SP[id];detEls[i].style.transform='translate('+p.x+'px,'+p.y+'px)'});
  const m=SP[game.pos];
  el('circle',{cx:m.x,cy:m.y,r:6,class:'pulse',style:'fill:none;stroke:var(--me)','stroke-width':1.6},gMarks);
  el('circle',{cx:m.x,cy:m.y,r:5.4,style:'fill:var(--me);stroke:var(--meline)','stroke-width':1.8},gMarks);
  renderHints();
}
function renderHints(){
  gHint.innerHTML='';
  if(!sel||busy||game.over)return;
  NZ.legalMoves(G,game,sel).forEach(d=>{const p=SP[d];
    el('circle',{cx:p.x,cy:p.y,r:8.2,style:'fill:var(--hint);fill-opacity:.2;stroke:var(--hint)','stroke-width':2.3,'pointer-events':'none'},gHint);
    const h=el('circle',{cx:p.x,cy:p.y,r:11,fill:'transparent',style:'cursor:pointer'},gHint);
    h.addEventListener('click',()=>{if(!suppress)move(d)});
    if(!SP[d].lab){const t=el('text',{x:p.x+10,y:p.y+4,style:'font-family:var(--font);font-size:11px;font-weight:700;fill:var(--label);paint-order:stroke;stroke:var(--halo);stroke-width:3px;pointer-events:none'},gHint);t.textContent=nm(d)}
  });
}
function renderAll(){renderHud();renderTickets();renderChips();renderTrack();renderMarks()}

// ---------- Spielfluss ----------
function pick(t){
  if(busy||game.over)return;
  if(t==='D'){if(stage===1)return;armed=!armed;sel=null;msg(armed?'Doppelzug aktiv: Wähle Ticket und Ziel für die erste Etappe.':'Doppelzug abgebrochen.');renderAll();return}
  sel=(sel===t)?null:t;
  if(sel){const n=NZ.legalMoves(G,game,sel).length;msg(TNAME[sel]+': '+n+' mögliche Ziele. Tippe eins auf der Karte oder in der Liste.')}else msg(stage?'Zweite Etappe: Wähle ein Ticket.':'Wähle ein Ticket.');
  renderAll();
}
async function move(dest){
  if(busy||game.over||!sel)return;
  const t=sel;
  const second=(stage===1);
  const ev=NZ.playerMove(G,game,t,dest,{second});
  if(armed&&!second){NZ.useDouble(game);stage=1;sel=null;if(!NZ.anyMove(G,game)){armed=false;stage=0;await endTurn();return}msg('Doppelzug: Wähle Ticket und Ziel für die zweite Etappe.');renderAll();centerIfZoomed();return}
  sel=null;
  if(game.over){await finish();return}
  armed=false;stage=0;
  await endTurn();
}
function centerIfZoomed(){if(V.w<VW*.95)centerOn(game.pos,V.w)}
async function endTurn(){
  busy=true;renderAll();
  const rev=NZ.endPlayerTurn(G,game);
  if(rev){banner('Aufdeckung: Die Detektive sehen dich',1400);msg('Aufgedeckt! Die Detektive wissen jetzt, wo du bist.');renderAll();await sleep(1500)}
  else{banner('Detektive ziehen …');renderAll();await sleep(350)}
  const moves=NZ.detectivesTurn(G,game);
  for(const m of moves){detShow[m.i]=m.to;renderMarks();if(m.t)await sleep(420)}
  $('banner').classList.remove('show');
  if(game.over){await finish();return}
  NZ.nextRound(G,game);
  if(game.over){await finish();return}
  busy=false;
  const nr=NZ.REVEAL.includes(game.round);
  msg(nr?'Achtung: Nach deinem Zug in dieser Runde wirst du aufgedeckt. Wähle ein Ticket.':'Wähle ein Ticket.');
  renderAll();centerIfZoomed();
}
async function finish(){
  busy=true;$('banner').classList.remove('show');renderAll();
  const st=store.get('nz-stats',{played:0,wins:0});st.played++;if(game.result==='win')st.wins++;store.set('nz-stats',st);
  await sleep(700);
  showEnd(st);
}
function startGame(seed){
  game=NZ.newGame(G,seed,nDet);sel=null;armed=false;stage=0;busy=false;
  detShow=game.det.map(d=>d.pos);
  buildStatic();setView(0,0,VW);renderAll();
  msg('Wähle ein Ticket. Dein Ziel ist '+nm(game.goal)+'.');
  $('ov').classList.add('hide');
}
function symbol(c){return c===3?'<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="5" fill="currentColor"/></svg>':c===2?'<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>':'<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.2" fill="currentColor"/></svg>'}
function showEnd(st){
  const R=game.result;
  const T={win:['Geschafft','Du hast '+nm(game.goal)+' in Runde '+game.round+' erreicht, ohne gestellt zu werden.'],
    caught:['Gestellt','Ein Detektiv hat dich in '+nm(game.pos)+' erwischt (Runde '+game.round+').'],
    time:['Zeit abgelaufen','Nach '+game.maxr+' Runden warst du nicht in '+nm(game.goal)+'.'],
    stuck:['Festgefahren','Dir blieb kein Ticket für eine mögliche Fahrt.']}[R];
  $('card').innerHTML='<h2>'+T[0]+'</h2><p>'+T[1]+'</p><p style="color:var(--muted);font-size:13px">Bisher '+st.wins+' von '+st.played+' Partien gewonnen.</p>'+
   '<div class="row"><button class="go" id="again">Neue Partie</button><button id="view">Karte ansehen</button></div>';
  $('ov').classList.remove('hide');
  $('again').onclick=()=>startGame('r'+Math.random());
  $('view').onclick=()=>{$('ov').classList.add('hide');msg('Partie beendet. Menü öffnet eine neue Partie.')};
}
function showMenu(first){
  const th=document.body.dataset.theme;
  const dl={3:'Leicht (3 Detektive)',4:'Normal (4 Detektive)',5:'Schwer (5 Detektive)'};
  const logosHTML=`<div style="display:flex;gap:14px;margin:0 0 16px;justify-content:center"><svg width="84" height="84" viewBox="0 0 100 100" role="img" aria-label="Fahrkarte mit Auge"><defs><clipPath id="clI"><rect width="100" height="100" rx="22"/></clipPath></defs><g clip-path="url(#clI)"><rect width="100" height="100" fill="#14213D" /><g transform="rotate(-14 50 50)"><rect x="28" y="8" width="44" height="86" rx="3" fill="#EFE6CF" /><rect x="28" y="8" width="44" height="15" rx="3" fill="#E5383B" /><rect x="35" y="72" width="30" height="2.6" fill="#9a927c" /><rect x="35" y="79" width="22" height="2.6" fill="#9a927c" /><circle cx="50" cy="48" r="11" fill="#0B1020" /><ellipse cx="50" cy="48" rx="8" ry="4.6" fill="#fff" /><circle cx="51" cy="48" r="2.9" fill="#0B1020" /></g></g></svg><svg width="84" height="84" viewBox="0 0 100 100" role="img" aria-label="Trenchcoat mit Hut"><defs><clipPath id="clH"><rect width="100" height="100" rx="22"/></clipPath></defs><g clip-path="url(#clH)"><rect width="100" height="100" fill="#2a2a2a" /><ellipse cx="50" cy="52" rx="16" ry="17" fill="#0d0d0d" /><ellipse cx="43" cy="49" rx="3" ry="1.7" fill="#fff" /><ellipse cx="57" cy="49" rx="3" ry="1.7" fill="#fff" /><polygon points="10,100 22,64 47,78 52,100" fill="#D8C9A3" /><polygon points="90,100 78,64 53,78 48,100" fill="#C4B58F" /><polygon points="22,64 34,58 47,78" fill="#E6D9B6" /><polygon points="78,64 66,58 53,78" fill="#D2C49E" /><ellipse cx="50" cy="40" rx="33" ry="7.4" fill="#000" /><path d="M31 40 Q31 13 50 13 Q69 13 69 40 Z" fill="#000" /><rect x="31" y="30" width="38" height="5.4" fill="#5b5b5b" /></g></svg></div>`;
  $('card').innerHTML=logosHTML+'<h1>Blinder Passagier</h1><p>Du bist der Flüchtende. Erreiche dein geheimes Ziel in Europa, bevor dich die Detektive stellen.</p>'+
   '<ul><li><b>Stationen</b> bestimmen, womit du wo ankommst. Ein Regionalzug fährt eine Station weit und hält überall.</li>'+
   '<li>Der <b>Intercity</b> fährt bis zu zwei Stationen und hält an der ersten Station an Ring oder Knoten, an der zweiten nur am Knoten, der <b>Nachtzug</b> bis zu drei und hält nur am Knoten.</li>'+
   '<li>Die Detektive sehen nur, welches Ticket du benutzt hast. Du wirst in Runde 5, 10, 15 und 20 aufgedeckt.</li>'+
   '<li><b>Schwarz</b> versteckt die Zugart und erlaubt als Einziges Fähren. Der <b>Doppelzug</b> gibt zwei Etappen in einer Runde.</li>'+
   '<li>Tickets, die Detektive ausgeben, bekommst du.</li></ul>'+
   '<div class="legend"><span style="color:var(--ink)">'+symbol(1)+'Halt</span><span style="color:var(--ink)">'+symbol(2)+'Fernbahnhof</span><span style="color:var(--ink)">'+symbol(3)+'Knoten</span></div>'+
   '<div class="lab">Schwierigkeit</div><div class="row" id="dif">'+[3,4,5].map(n=>'<button data-n="'+n+'" class="'+(n===nDet?'on':'')+'">'+dl[n]+'</button>').join('')+'</div>'+
   '<div class="row"><button class="go" id="daily">Tagesrätsel</button><button class="go" id="rand">Zufällige Partie</button></div>'+
   (first?'':'<div class="row"><button id="cont">Zurück zur Partie</button></div>');
  $('ov').classList.remove('hide');
  document.querySelectorAll('#dif button').forEach(b=>b.onclick=()=>{nDet=+b.dataset.n;store.set('nz-det',nDet);document.querySelectorAll('#dif button').forEach(x=>x.classList.toggle('on',x===b))});
  $('daily').onclick=()=>startGame('tag-'+new Date().toISOString().slice(0,10)+'-'+nDet);
  $('rand').onclick=()=>startGame('r'+Math.random());
  if($('cont'))$('cont').onclick=()=>$('ov').classList.add('hide');
}
$('bMenu').onclick=()=>showMenu(false);
$('bBel').onclick=()=>{showBel=!showBel;$('bBel').classList.toggle('on',showBel);$('bBel').setAttribute('aria-pressed',showBel);$('bBel').textContent=showBel?'Verdacht verbergen':'Verdacht zeigen';if(game)renderMarks()};
document.querySelectorAll('#themes button').forEach(b=>b.onclick=()=>setTheme(b.dataset.th));
function setTheme(t){document.body.dataset.theme=t;store.set('nz-theme',t);document.querySelectorAll('#themes button').forEach(b=>b.classList.toggle('on',b.dataset.th===t));const m=document.querySelector('meta[name=theme-color]');m.content={hell:'#F4F1EA',gelb:'#F5D33F',nacht:'#14110A'}[t]}
nDet=store.get('nz-det',4);setTheme(store.get('nz-theme',(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'nacht':'hell'));
game=NZ.newGame(G,'start',nDet);detShow=game.det.map(d=>d.pos);buildStatic();setView(0,0,VW);renderAll();
showMenu(true);
})();
</script>
